<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>D2 봇 상태</title>
<!--
  D2 봇 상태 페이지 (11/5). PC마다 도우미가 2분마다 올리는 요약(Supabase의 d2_status 표)을 공개 키로 읽어서 보여줘요.
  읽기만 해요 - 이 페이지로는 아무것도 바꿀 수 없어요. 주소와 공개 키는 같은 폴더의 config.js에 넣어요.
-->
<style>
:root {
  --bg: #f6f5f1; --card: #ffffff; --ink: #1d1d1b; --mute: #6b6a64; --line: #e4e2da; --soft: #f0eee7;
  --ok: #1f8a4c; --warn: #b26b00; --bad: #c62f2f; --acc: #3559c7; --bar: #3559c7; --bar2: #8a63d2;
  --q4: #3b4fd8; --q5: #198c19; --q6: #9a7d00; --q7: #94702c; --qr: #b85c00;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 10px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --card: #1e1d1b; --ink: #ecebe6; --mute: #a3a199; --line: #34322e; --soft: #262522;
    --ok: #4cc27f; --warn: #e3a33b; --bad: #ef6b6b; --acc: #8aa4ff; --bar: #7c97ff; --bar2: #b394f0;
    --q4: #8c96ff; --q5: #4fd14f; --q6: #e6d24a; --q7: #d4b67a; --qr: #f0a050;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --card: #1e1d1b; --ink: #ecebe6; --mute: #a3a199; --line: #34322e; --soft: #262522;
  --ok: #4cc27f; --warn: #e3a33b; --bad: #ef6b6b; --acc: #8aa4ff; --bar: #7c97ff; --bar2: #b394f0;
  --q4: #8c96ff; --q5: #4fd14f; --q6: #e6d24a; --q7: #d4b67a; --qr: #f0a050;
  --shadow: none;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
  font-variant-numeric: tabular-nums;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 20px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
.meta { color: var(--mute); font-size: 13px; display: flex; align-items: center; gap: 10px; }
button {
  font: inherit; font-size: 13px; color: var(--ink); background: var(--card); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 12px; cursor: pointer;
}
button:hover { border-color: var(--mute); }
.note { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--warn); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
.note.bad { border-left-color: var(--bad); }
.note code { background: var(--soft); padding: 1px 5px; border-radius: 4px; font-size: 13px; word-break: break-all; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 16px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow); min-width: 0; }
.tile .k { color: var(--mute); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.tile .v small { font-size: 13px; font-weight: 500; color: var(--mute); }
.tile .v small.gb { display: block; font-size: 12px; line-height: 1.45; margin-top: 2px; }
.tile .v small.gb span { white-space: nowrap; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.pchead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.pchead h2 { font-size: 18px; margin: 0; }
h2 small, h3 small { color: var(--mute); font-weight: 500; font-size: 12px; }
h3 { font-size: 14px; margin: 14px 0 6px; }
.pill { font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.bad { color: var(--bad); }
.sub { color: var(--mute); font-size: 13px; margin: 4px 0 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.sub b { color: var(--ink); }
.err { color: var(--bad); font-size: 13px; margin: 4px 0; }
.spark { display: inline-flex; align-items: flex-end; gap: 2px; height: 22px; vertical-align: middle; }
.spark i { display: block; width: 8px; background: var(--bar); border-radius: 2px 2px 0 0; min-height: 1px; opacity: .55; }
.spark i.today { opacity: 1; }
.chars { border-top: 1px solid var(--line); }
.ch {
  display: grid; grid-template-columns: minmax(150px, 1.3fr) minmax(110px, .9fr) minmax(150px, 1.3fr) minmax(170px, 1.6fr) minmax(60px, .5fr);
  gap: 4px 12px; align-items: center; padding: 8px 2px; border-bottom: 1px solid var(--line); font-size: 14px;
}
.ch > div { min-width: 0; }
.ch.idle { color: var(--mute); }
.cn b { font-weight: 650; }
.cn small, .ca small { color: var(--mute); display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--mute); margin-right: 6px; vertical-align: 1px; }
.dot.run { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 22%, transparent); }
.dot.stop { background: var(--bad); }
.xp { height: 4px; background: var(--soft); border-radius: 2px; overflow: hidden; margin-top: 3px; max-width: 120px; }
.xp i { display: block; height: 100%; background: var(--bar2); }
.cl small { color: var(--mute); }
.cs { font-size: 13px; color: var(--mute); }
.cs .n { color: var(--ink); }
.cs .hot { color: var(--bad); font-weight: 600; }
.cs .amb { color: var(--warn); font-weight: 600; }
.cs .pen { color: var(--mute); font-size: 12px; }
.cv { text-align: right; white-space: nowrap; }
.cvm { display: none; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--soft); color: var(--mute); margin-left: 4px; vertical-align: 1px; }
.chip.bad { color: var(--bad); }
.finds { list-style: none; margin: 0; padding: 0; font-size: 14px; }
.finds li { display: flex; gap: 8px; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed var(--line); }
.finds li:last-child { border-bottom: 0; }
.finds .w { color: var(--mute); font-size: 12px; white-space: nowrap; }
.finds .t { min-width: 0; overflow-wrap: anywhere; }
.q4 { color: var(--q4); } .q5 { color: var(--q5); } .q6 { color: var(--q6); } .q7 { color: var(--q7); } .qr { color: var(--qr); }
.empty { color: var(--mute); font-size: 13px; padding: 4px 0; }
.bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px 18px; }
.brow .bl { display: flex; justify-content: space-between; font-size: 13px; }
.brow .bl b { font-weight: 650; }
.bar { height: 8px; background: var(--soft); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--bar); }
.bar.pf i { background: var(--bar2); }
footer { color: var(--mute); font-size: 12px; text-align: center; margin-top: 18px; }
/* (11/6) the runes: each PC's bank and the 창고, added up */
.rtw { overflow-x: auto; margin-top: 8px; }
.rt { width: 100%; border-collapse: collapse; font-size: 14px; }
.rt th, .rt td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.rt th { color: var(--mute); font-weight: 500; font-size: 12.5px; }
.rt th:first-child, .rt td:first-child { text-align: left; }
.rt td.tot { font-weight: 650; }
.rt td.z { color: var(--mute); }
.rt .ri { display: inline-flex; align-items: center; gap: 8px; }
.rt .ri .pic { width: 30px; height: 30px; flex: none; display: inline-flex; align-items: center; justify-content: center; background: #0b0a09; border-radius: 4px; }
.rt .ri img { image-rendering: pixelated; max-width: 28px; max-height: 28px; }
.rt tr.hi td:first-child { font-weight: 600; }
/* (11/6) 일별 경험치: the names stay in view while the days scroll sideways (a phone) */
.xt { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.xt th, .xt td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.xt th { color: var(--mute); font-weight: 500; font-size: 12.5px; }
.xt th:first-child, .xt td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
.xt td:first-child small { color: var(--mute); margin-left: 6px; font-size: 11.5px; }
.xt td.z { color: var(--mute); }
.xt td.neg { color: var(--bad); }
.xt .today { font-weight: 650; }
.xt tr.grp td { color: var(--mute); font-size: 12px; font-weight: 600; padding-top: 10px; }
.xbtn { margin-left: auto; }
/* (11/5) items drawn as in the game: pictures from item_gfx.js, the tooltip in the game's colors (always dark, like the game) */
.cnb { background: none; border: 0; padding: 0; margin: 0; font: inherit; font-weight: 650; color: inherit; cursor: pointer;
  text-decoration: underline dotted; text-underline-offset: 3px; border-radius: 0; }
.cnb:hover { color: var(--acc); }
.items { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px 14px; }
.it { display: flex; gap: 10px; align-items: center; padding: 3px 0; min-width: 0; }
.it .pic { flex: none; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; background: #0b0a09;
  border: 1px solid #2c261d; border-radius: 6px; cursor: help; overflow: hidden; }
.it .pic img { image-rendering: pixelated; max-width: 42px; max-height: 42px; }
.it .pic .nm { color: #9c8f7a; font-size: 9px; text-align: center; padding: 2px; line-height: 1.1; }
.it .tx { flex: 1; min-width: 0; font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; cursor: help; }
.it .tx small { display: block; color: var(--mute); font-size: 12px; }
/* (11/7) the bots' gear changes: what was there (faded) -> what is there now */
.items.gcl { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
.it .pic.was { width: 34px; height: 34px; opacity: .6; }
.it .pic.was img { max-width: 30px; max-height: 30px; }
.it .arr { flex: none; color: var(--mute); font-size: 13px; margin: 0 -5px; }
.it .tx .was { opacity: .7; }
.g-unique { --qc: #b8a270; } .g-set { --qc: #3fcf5a; } .g-rare { --qc: #f2e26b; } .g-magic { --qc: #7b86ff; } .g-craft { --qc: #f0a13a; }
.g-rw { --qc: #c28cff; } .g-normal { --qc: #e6dccb; } .g-rune { --qc: #e0c276; }
#tip { position: fixed; z-index: 70; pointer-events: none; max-width: min(340px, calc(100vw - 16px)); background: #0b0908; color: #e6dccb;
  border: 1px solid #5a4a30; border-radius: 6px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; white-space: pre-line; display: none;
  box-shadow: 0 6px 24px rgba(0,0,0,.6); }
#tip .tt { font-size: 13.5px; margin-bottom: 4px; color: var(--qc, #e6dccb); }
#tip .pic { display: flex; justify-content: center; align-items: center; margin: 2px 0 8px; }
#tip .pic img { image-rendering: pixelated; }
#tip .tb { color: #ffffff; } #tip .tr { color: #ff5a5a; } #tip .ts { color: #3fcf5a; } #tip .tp { color: #7b86ff; } #tip .tu { color: #b8a270; }
#tip .tgy { color: #8f8f8f; } #tip .tk { color: #5c5c5c; } #tip .tn { color: #c9b98f; } #tip .to { color: #f0a13a; }
#tip .ty { color: #f2e26b; } #tip .tdg { color: #2f9e48; } #tip .tpu { color: #b07cff; } #tip .tnote { color: #9c8f7a; }
/* a character's items (like the dashboard's save view: 창고 / 가방 / 큐브 / 착용 / 스왑 / 허리띠 / 용병) */
.ov { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: none; align-items: flex-start; justify-content: center;
  padding: 24px 10px; overflow-y: auto; }
.ov.on { display: flex; }
.dlg { background: #17130f; color: #e6dccb; border: 1px solid #3a2f22; border-radius: 12px; max-width: 100%; padding: 14px 16px 18px;
  box-shadow: 0 10px 40px rgba(0,0,0,.5); }
.dlg .dh { display: flex; gap: 6px 12px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
.dlg .dh b { font-size: 17px; color: #d4af6a; }
.dlg .dh .s2 { color: #9c8f7a; font-size: 12.5px; }
.dlg .x { margin-left: auto; background: #1f1a14; color: #e6dccb; border-color: #3a2f22; }
.dlg .msg { color: #9c8f7a; font-size: 13px; padding: 8px 0; }
.sdwrap { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.sdcol { display: flex; flex-direction: column; gap: 12px; }
.sdh { font-size: 12.5px; color: #9c8f7a; margin-bottom: 4px; }
.sdh b { color: #e6dccb; font-weight: 600; }
.sdg { --cell: 40px; display: grid; grid-template-columns: repeat(var(--w), var(--cell)); grid-template-rows: repeat(var(--h), var(--cell));
  width: calc(var(--w) * var(--cell) + 1px); height: calc(var(--h) * var(--cell) + 1px); background-color: #0b0a09;
  border-right: 1px solid #2c261d; border-bottom: 1px solid #2c261d;
  background-image: linear-gradient(to right, #2c261d 1px, transparent 1px), linear-gradient(to bottom, #2c261d 1px, transparent 1px);
  background-size: var(--cell) var(--cell); }
.sdg.doll { background-image: none; border: 1px solid #2c261d; }
.sdslot { margin: 2px 1px 1px 2px; border: 1px dashed #3a3226; border-radius: 3px; display: flex; align-items: center; justify-content: center;
  color: #5a4e3c; font-size: 10.5px; }
.sdi { position: relative; margin: 2px 1px 1px 2px; color: var(--qc, #e6dccb); border: 1px solid color-mix(in srgb, var(--qc, #e6dccb) 35%, transparent);
  border-radius: 3px; background: rgba(255,255,255,.035); display: flex; align-items: center; justify-content: center; overflow: hidden;
  font-size: 10px; line-height: 1.15; text-align: center; min-width: 0; min-height: 0; cursor: help; }
.sdi:hover, .sdi.tap { border-color: var(--qc, #e6dccb); background: rgba(255,255,255,.08); }
.sdi img { image-rendering: pixelated; max-width: 100%; max-height: 100%; pointer-events: none; }
.sdi .nm { padding: 2px; word-break: keep-all; pointer-events: none; }
@media (max-width: 720px) {
  .ch { grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "n n" "l a" "s s"; }
  .cn { grid-area: n; } .cl { grid-area: l; } .ca { grid-area: a; text-align: right; } .cs { grid-area: s; }
  .cv { display: none; }
  .cvm { display: inline; float: right; margin-left: 8px; white-space: nowrap; }
  .cn small { white-space: normal; }
  .ca small { display: inline; white-space: normal; }
  .ca small::before { content: " · "; }
  .cs:empty { display: none; }
  .tile .v { font-size: 19px; }
  .sdg { --cell: clamp(24px, calc((100vw - 64px) / 10), 40px); }
  .sdwrap { gap: 12px; }
  .dlg { padding: 12px 10px 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>D2 봇 상태</h1>
    <div class="meta"><span id="upd">불러오는 중…</span><button id="reload" type="button">새로고침</button></div>
  </header>
  <div id="warn"></div>
  <section class="tiles" id="sum"></section>
  <div id="pcs"></div>
  <div id="shared"></div>
  <div id="runes"></div>
  <div id="xpd"></div>
  <footer>PC마다 도우미가 2분마다 올려요 · 이 페이지는 1분마다 새로 불러와요 · 캐릭 이름을 누르면 장비가 보여요 · 시간은 한국 시간 · 읽기 전용</footer>
</div>
<div id="tip"></div>
<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="캐릭 장비"><div class="dlg" id="dlg"></div></div>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  var CFG = window.D2_STATUS_CONFIG || {};
  var REFRESH = 60 * 1000;
  var CLS = ["아마존", "소서리스", "네크로맨서", "팔라딘", "바바리안", "드루이드", "어쌔신"];
  var DIFF = ["노멀", "나이트메어", "헬"];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; });
  };
  var num = function (v) { var n = Number(v); return isFinite(n) ? n : 0; };
  var f1 = function (v) { var n = Math.round(num(v) * 10) / 10; return n.toFixed(n % 1 ? 1 : 0); };
  // (11/6) experience in Korean units: 13.8억, 7,743만, 950
  var fxp = function (v) {
    var n = Math.max(0, num(v));
    if (n >= 1e8) return (Math.round(n / 1e7) / 10).toLocaleString("ko-KR") + "억";
    if (n >= 1e4) return Math.round(n / 1e4).toLocaleString("ko-KR") + "만";
    return String(Math.round(n));
  };
  // (11/6) a day's experience can go below 0 (a death's loss): with its sign
  var sxp = function (v) { return num(v) < 0 ? "\u2212" + fxp(-num(v)) : "+" + fxp(v); };
  // (11/6, the user: "괄호 열고 패널티 얼마 이런거 표시하면 좋겠어") the high-level experience penalty: the share of experience a level
  // gets (kolbot Experience.expPenalty, in 1024ths: 69 and below all of it, 70 976, ... 98 6, 99 5)
  var XP_PEN = [1024, 976, 928, 880, 832, 784, 736, 688, 640, 592, 544, 496, 448, 400, 352, 304, 256, 192, 144, 108, 81, 61, 46, 35, 26, 20, 15, 11, 8, 6, 5];
  var penalty = function (lvl) {
    var i = Math.max(0, Math.min(XP_PEN.length - 1, Math.floor(num(lvl)) - 69));
    var p = 100 - (XP_PEN[i] * 100) / 1024;
    return p >= 99 ? (Math.floor(p * 10) / 10).toFixed(1) : String(Math.round(p));
  };
  var KST = 9 * 3600 * 1000;
  var kstDay = function (ts) { return new Date(num(ts) + KST).toISOString().slice(0, 10); };
  var hm = function (ts) { var d = new Date(num(ts) + KST); return d.toISOString().slice(11, 16); };
  var ago = function (ms) {
    ms = Math.max(0, ms);
    if (ms < 90 * 1000) return "방금";
    if (ms < 3600 * 1000) return Math.round(ms / 60000) + "분 전";
    if (ms < 48 * 3600 * 1000) return Math.round(ms / 3600000) + "시간 전";
    return Math.round(ms / 86400000) + "일 전";
  };
  var qClass = function (x) { return x.r ? "qr" : x.rw ? "qr" : ({ 4: "q4", 5: "q5", 6: "q6", 7: "q7" })[x.q] || ""; };

  // ---- (11/5) item pictures: item_gfx.js next to this page (the dashboard's file: built from the game's own files) ----
  var GFX = null, GFX_CACHE = {}, gfxState = "";
  function loadGfx() {
    if (gfxState) return;
    gfxState = "loading";
    var sc = document.createElement("script");
    sc.src = CFG.gfx || "item_gfx.js";
    sc.onload = function () { gfxState = window.D2SB_GFX ? "ok" : "none"; if (gfxState === "ok") redraw(); };
    sc.onerror = function () { gfxState = "none"; };
    document.head.appendChild(sc);
  }
  function gfxData() {
    if (GFX || !window.D2SB_GFX) return GFX;
    var G = window.D2SB_GFX;
    var un = function (s) { var b = atob(s); var u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
    GFX = { G: G, un: un, pal: un(G.pal), cmaps: {} };
    Object.keys(G.cmaps || {}).forEach(function (k) { GFX.cmaps[k] = un(G.cmaps[k]); });
    return GFX;
  }
  var gnorm = function (s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); };
  /** which picture the game draws for this item: base / variant / unique / set file + colour (the dashboard's gfxSpec) */
  function gfxSpec(it) {

    var body = "", rows = 0;
    has.forEach(function (p) {
      var base = Date.parse(kstDay(num(p.d.ts) || p.at)); // (xh[0] is this PC's day when it sent)
      var chars = listed(p).filter(function (c) { return num(c.l) < 99; });
      if (!chars.length) return;
      if (pcs.length > 1) body += '<tr class="grp"><td colspan="' + (cols.length + 1) + '">' + esc(p.label) + "</td></tr>";
      chars.forEach(function (c) {
        rows++;
        body += "<tr><td>" + esc(c.n) + "<small>Lv " + num(c.l) + "</small></td>" + cols.map(function (d, i) {
          var k = Math.round((base - Date.parse(d)) / DAYMS);
          var v = k >= 0 && k < c.xh.length ? c.xh[k] : null;
          var t = i === 0 ? " today" : "";
          if (v === null || v === undefined) return '<td class="z' + t + '">-</td>';
          if (!num(v)) return '<td class="z' + t + '">0</td>';
          return '<td class="' + (num(v) < 0 ? "neg" : "") + t + '">' + (num(v) < 0 ? "\u2212" + fxp(-num(v)) : fxp(v)) + "</td>";
        }).join("") + "</tr>";
      });
    });
    var h = '<section class="card"><div class="pchead"><h2>일별 경험치 <small>0시~24시 · 죽어서 잃은 것은 빼고 · 한국 시간</small></h2>'
      + '<button type="button" id="xpdN" class="xbtn">' + (XPD_N === 7 ? "30일 보기" : "7일만 보기") + "</button></div>";
    if (rows) {
      h += '<div class="rtw"><table class="xt"><thead><tr><th>캐릭</th>' + cols.map(function (d, i) {
        return '<th class="' + (i === 0 ? "today" : "") + '">' + label(d, i) + "</th>";
      }).join("") + "</tr></thead><tbody>" + body + "</tbody></table></div>";
    } else h += '<div class="empty">아직 기록이 없어요</div>';
    var old = pcs.filter(function (p) { return has.indexOf(p) < 0; }).map(function (p) { return p.label; });
    if (old.length) h += '<div class="sub" style="margin-top:6px">' + esc(old.join(", ")) + "은(는) 새 도우미를 넣으면 나와요</div>";
    return h + "</section>";
  }
  function isRunning(p, c) {
    // the bot wrote its log within 10 minutes of the PC's last upload, and that upload is recent
    return num(c.la) > 0 && num(p.d.ts) - num(c.la) < 10 * 60 * 1000 && p.age < 15 * 60 * 1000;
  }
  function pcCard(p) {
    var d = p.d;
    var pill = p.age < 6 * 60 * 1000 ? ["ok", "정상"] : p.age < 20 * 60 * 1000 ? ["warn", "늦음"] : ["bad", "연결 끊김"];
    var chars = Array.isArray(d.chars) ? d.chars : [];
    var h = '<article class="card pc"><div class="pchead"><h2>' + esc(p.label) + '</h2><span class="pill ' + pill[0] + '">' + pill[1] + " · " + esc(ago(p.age)) + "</span></div>";
    if (d.err) h += '<div class="err">DB 문제: ' + esc(d.err) + "</div>";
    var I = d.inc || {};
    var days = Array.isArray(I.days) ? I.days : [];
    var y = days.length > 1 ? days[days.length - 2] : null;
    var mx = days.reduce(function (a, x) { return Math.max(a, num(x && x[1])); }, 0);
    var spark = days.length ? '<span class="spark" title="최근 7일 수입">' + days.map(function (x, i) {
      var v = num(x && x[1]);
      return '<i class="' + (i === days.length - 1 ? "today" : "") + '" style="height:' + (mx ? Math.max(4, Math.round((v / mx) * 100)) : 4) + '%" title="' + esc(String(x && x[0]).slice(5)) + " · " + f1(v) + ' Vex"></i>';
    }).join("") + "</span>" : "";
    h += '<div class="sub"><span>오늘 수입 <b>' + (p.today ? f1(I.v) : "0") + "</b> Vex</span><span>고급 <b>" + (p.today ? num(I.hi) : 0) + "</b>개</span>"
      + (y ? "<span>어제 " + f1(y[1]) + " Vex</span>" : "") + spark + (I.all !== undefined ? "<span>누적 " + f1(I.all) + " Vex</span>" : "") + "<span>캐릭 " + chars.length + "</span>"
      + (d.gd && typeof d.gd === "object" ? "<span>은행 골드 <b>" + fxp(num(d.gd.b) + num(d.gd.p)) + "</b></span><span>캐릭 골드 <b>" + fxp(d.gd.c) + "</b></span>" : "") + "</div>";
    if (!p.today) h += '<div class="err">오늘 올라온 기록이 없어요 (' + esc(ago(p.age)) + "에 마지막으로 올림)</div>";
    h += '<div class="chars">' + (chars.length ? chars.map(function (c) { return charRow(p, c, I.by || {}); }).join("") : '<div class="empty">캐릭이 없어요</div>') + "</div>";
    var top = Array.isArray(d.top) ? d.top : [];
    if (top.length && p.today) {
      h += '<h3>오늘 들어온 고급 템 <small>(1 Vex 이상)</small></h3><ul class="items">' + top.map(function (x) {
        return itemLine(x, esc(x.c) + " · " + f1(x.v) + " Vex · " + esc(hm(x.ts)));
      }).join("") + "</ul>";
    }
    // (11/7, the user: "최근 봇의 장비가 바뀐게 있으면 그 정보를 보여주면 좋겠어") the last 3 days' gear changes, newest first
    var gc = Array.isArray(d.gc) ? d.gc.filter(function (x) { return x && x.n; }) : [];
    if (gc.length) h += '<h3>최근 장비 변경 <small>(3일)</small></h3><ul class="items gcl">' + gc.map(gearLine).join("") + "</ul>";
    return h + "</article>";
  }
  function charRow(p, c, by) {
    var gearBtn = p.pub ? '<button type="button" class="cnb" data-pub="' + esc(p.pub) + '" data-ck="' + esc(c.n) + '" data-pc="' + esc(p.label) + '" title="장비 보기">' + esc(c.n) + "</button>" : "<b>" + esc(c.n) + "</b>";
    var running = isRunning(p, c);
    var idle = num(c.la) > 0 ? num(p.d.ts) - num(c.la) : -1;
    var state = running ? "" : idle >= 0 ? " · 멈춤 " + ago(idle).replace(" 전", "") : " · 오늘 기록 없음";
    var cls = CLS[num(c.c)] !== undefined && num(c.c) >= 0 ? CLS[num(c.c)] : "";
    var stats = [];
    if (p.today && num(c.la) > 0) {
      stats.push('판 <span class="n">' + num(c.g) + "</span>");
      if (typeof c.xg === "number" && num(c.l) < 99) {
        stats.push('경험치 <span class="' + (num(c.xg) < 0 ? "hot" : "n") + '">' + sxp(c.xg) + "</span>" + (num(c.l) >= 70 ? ' <span class="pen">(패널티 ' + penalty(c.l) + "%)</span>" : ""));
      }
      if (typeof c.de === "number") stats.push("죽음 " + (c.de ? '<span class="hot">' + c.de + "</span>" : '<span class="n">0</span>'));
      stats.push("재시작 " + (num(c.rs) ? '<span class="amb">' + num(c.rs) + "</span>" + (num(c.cr) ? " (충돌 " + num(c.cr) + ")" : "") : '<span class="n">0</span>'));
      if (num(c.bx)) stats.push('일찍 나감 <span class="amb">' + num(c.bx) + "</span>");
    }
    var xp = typeof c.x === "number" ? '<small> · ' + f1(c.x) + '%</small><div class="xp"><i style="width:' + Math.max(0, Math.min(100, c.x)) + '%"></i></div>' : "";
    var vex = p.today && by[c.n] ? f1(by[c.n]) + " <small>Vex</small>" : "";
    return '<div class="ch' + (running ? "" : " idle") + '">'
      + '<div class="cn">' + (vex ? '<span class="cvm">' + vex + "</span>" : "") + '<span class="dot ' + (running ? "run" : idle >= 0 ? "stop" : "") + '"></span>' + gearBtn
      + (c.f ? '<span class="chip">파밍</span>' : "") + (c.m ? "" : '<span class="chip bad">용병 없음</span>')
      + "<small>" + esc([cls, c.b].filter(Boolean).join(" · ")) + esc(state) + "</small></div>"
      + '<div class="cl">Lv <b>' + num(c.l) + "</b>" + xp + "</div>"
      + '<div class="ca">' + esc(DIFF[num(c.d)] || "") + "<small>" + esc(c.a || "") + "</small></div>"
      + '<div class="cs">' + (stats.length ? "오늘 " + stats.join(" · ") : "") + "</div>"
      + '<div class="cv">' + vex + "</div></div>";
  }
  function sharedCard(p, wg) {
    var H = p.d.hof || {};
    var bar = function (label, got, total, cls) {
      var pct = total ? (got / total) * 100 : 0;
      return '<div class="brow"><div class="bl"><span>' + label + "</span><span><b>" + got + "</b> / " + total + " · " + pct.toFixed(1) + '%</span></div><div class="bar ' + (cls || "") + '"><i style="width:' + pct.toFixed(1) + '%"></i></div></div>';
    };
    var pf = function (label, v) { return '<div class="brow"><div class="bl"><span>' + label + "</span><span><b>" + f1(v) + '%</b></span></div><div class="bar pf"><i style="width:' + Math.max(0, Math.min(100, num(v))) + '%"></i></div></div>'; };
    var P = Array.isArray(H.p) ? H.p : [0, 0, 0, 0], E = Array.isArray(H.e) ? H.e : [0, 0, 0, 0], R = Array.isArray(H.rw) ? H.rw : null;
    var h = '<section class="card"><div class="pchead"><h2>명예의 전당 · 창고 <small>모든 PC 공통 · ' + esc(p.label) + " 기준 · " + esc(ago(p.age)) + "</small></h2></div>";
    h += '<div class="bars" style="margin-top:10px">' + bar("일반 모음", num(P[0]), num(P[1])) + pf("일반 퍼펙트 기준", P[3])
      + (num(E[1]) ? bar("에테 모음", num(E[0]), num(E[1])) + pf("에테 퍼펙트 기준", E[3]) : "")
      + (R ? bar("룬워드 칸", num(R[0]), num(R[1])) : "") + "</div>";
    h += '<div class="sub" style="margin-top:8px"><span>퍼펙트 <b>' + num(P[2]) + "</b>/" + num(P[1]) + (num(E[1]) ? " · 에테 " + num(E[2]) + "/" + num(E[1]) : "") + "</span>"
      + "<span>5개 꽉 찬 칸 <b>" + num(H.full) + "</b></span><span>2개 이상 <b>" + num(H.two) + "</b></span>"
      + (typeof wg === "number" ? "<span>창고 골드 <b>" + fxp(wg) + "</b></span>" : "") + "</div>";
    // (11/7: the 창고's new items no longer listed - the user: "창고 아이템 바뀐건 굳이 안보여 줘도 될 것 같고")
    return h + "</section>";
  }

  // ---- (11/5) a character's items: what the dashboard's save view shows (d2_gear, sent by the helper when they change) ----
  var PANELS = { stash: ["창고", 6, 8], inv: ["가방", 10, 4], cube: ["큐브", 3, 4], worn: ["착용", 8, 8], swap: ["스왑 무기", 4, 4], belt: ["허리띠", 4, 4], merc: ["용병", 8, 6] };
  var MERC_BL = [1, 3, 4, 5];
  var BODY = { 1: [4, 1, 2, 2, "투구"], 2: [6, 2, 1, 1, "목걸이"], 3: [4, 3, 2, 3, "갑옷"], 4: [1, 2, 2, 4, "무기"], 5: [7, 2, 2, 4, "방패"],
    6: [3, 6, 1, 1, "반지"], 7: [6, 6, 1, 1, "반지"], 8: [4, 6, 2, 1, "허리띠"], 9: [7, 7, 2, 2, "신발"], 10: [1, 7, 2, 2, "장갑"],
    11: [1, 1, 2, 4, "무기"], 12: [3, 1, 2, 4, "방패"] };
  var GEAR = { ck: "", pub: "", pc: "", data: null, err: "", at: 0, loading: false };
  function panel(w, d) {
    var P = PANELS[w];
    var mine = (d.items || []).filter(function (it) { return it.w === w; });
    var body = w === "worn" || w === "swap" || w === "merc";
    var rows = w === "belt" ? Math.max(1, Math.min(4, num(d.beltRows) || 4)) : P[2];
    var area = function (b) { var a = BODY[b] || [1, 1, 1, 1]; return "grid-column:" + a[0] + " / span " + a[2] + ";grid-row:" + a[1] + " / span " + a[3]; };
    var at = function (it) {
      if (body) return area(it.bl);
      if (w === "belt") return "grid-column:" + (num(it.px) + 1) + ";grid-row:" + (rows - num(it.py));
      return "grid-column:" + (num(it.px) + 1) + " / span " + (num(it.iw) || 1) + ";grid-row:" + (num(it.py) + 1) + " / span " + (num(it.ih) || 1);
    };
    var worn = new Set(mine.map(function (it) { return num(it.bl); }));
    var slots = body ? Object.keys(BODY).filter(function (b) { return w === "merc" ? MERC_BL.indexOf(Number(b)) > -1 : (w === "swap") === (Number(b) >= 11); })
      .map(function (b) { return '<div class="sdslot" style="' + area(b) + '">' + (worn.has(Number(b)) ? "" : BODY[b][4]) + "</div>"; }).join("") : "";
    var tiles = mine.map(function (it) {
      var im = picOf(it);
      return '<div class="sdi ' + gq(it) + '" style="' + at(it) + '"' + tipAttr(it) + ">" + (im ? '<img src="' + im.url + '" alt="">' : '<span class="nm">' + esc(it.t) + "</span>") + "</div>";
    }).join("");
    return '<div><div class="sdh"><b>' + P[0] + "</b>" + (mine.length ? " · " + mine.length + "개" : "") + '</div><div class="sdg' + (body ? " doll" : "")
      + '" style="--w:' + P[1] + ";--h:" + rows + '">' + slots + tiles + "</div></div>";
  }
  function drawGear() {
    var d = GEAR.data;
    var head = '<div class="dh"><b>' + esc(GEAR.ck) + '</b><span class="s2">' + esc(GEAR.pc) + (d && d.lvl ? " · Lv " + num(d.lvl) : "")
      + (d ? " · " + (d.live ? "게임 중 기록 " + ago(Date.now() - num(d.live)) : "세이브 " + ago(Date.now() - num(d.mt || d.ts))) + " · 올린 때 " + ago(Date.now() - GEAR.at) : "")
      + '</span><button type="button" class="x" data-close>닫기</button></div>';
    var body;
    if (GEAR.loading && !d) body = '<div class="msg">불러오는 중…</div>';
    else if (GEAR.err) body = '<div class="msg">' + esc(GEAR.err) + "</div>";
    else if (!d) body = '<div class="msg">아직 올라온 장비가 없어요. 도우미가 캐릭마다 10분 안에 올려요.</div>';
    else {
      var hasMerc = (d.items || []).some(function (it) { return it.w === "merc"; });
      body = '<div class="sdwrap">' + panel("stash", d) + '<div class="sdcol">' + panel("inv", d) + (d.cube ? panel("cube", d) : "") + "</div>"
        + '<div class="sdcol">' + panel("worn", d) + '<div class="sdwrap">' + panel("swap", d) + panel("belt", d) + "</div></div>"
        + (hasMerc ? '<div class="sdcol">' + panel("merc", d) + "</div>" : "") + "</div>"
        + (gfxState === "none" ? '<div class="msg">템 그림 파일(item_gfx.js)이 이 페이지 옆에 없어서 이름으로 보여요.</div>' : "");
    }
    $("dlg").innerHTML = head + body;
  }
  async function openGear(pub, ck, pc) {
    GEAR = { ck: ck, pub: pub, pc: pc, data: null, err: "", at: 0, loading: true };
    hideTip();
    $("ov").classList.add("on");
    drawGear();
    try {
      var r = await fetch(base + "/rest/v1/d2_gear?select=ck,data,ts&pub=eq." + encodeURIComponent(pub) + "&ck=eq." + encodeURIComponent(ck), { headers: hdrs(), cache: "no-store", referrerPolicy: "no-referrer" });
      var t = await r.text();
      if (GEAR.ck !== ck || GEAR.pub !== pub) return;
      if (!r.ok) throw new Error(r.status === 404 ? "장비 표가 없어요 - d2sb_db.sql을 Supabase에서 한 번 더 실행해 주세요" : "HTTP " + r.status);
      var rows = JSON.parse(t);
      var row = Array.isArray(rows) ? rows[0] : null;
      GEAR.data = row && row.data && typeof row.data === "object" ? row.data : null;
      GEAR.at = row ? Date.parse(row.ts) || 0 : 0;
    } catch (e) {
      GEAR.err = "장비를 불러오지 못했어요: " + String(e && e.message ? e.message : e);
    }
    GEAR.loading = false;
    if ($("ov").classList.contains("on") && GEAR.ck === ck) drawGear();
  }
  function closeGear() { $("ov").classList.remove("on"); GEAR.ck = ""; hideTip(); }

  tip = $("tip");
  var touch = false;
  document.addEventListener("pointerdown", function (ev) { touch = ev.pointerType === "touch" || ev.pointerType === "pen"; }, true);
  document.addEventListener("mouseover", function (ev) {
    if (touch) return;
    var el = ev.target.closest && ev.target.closest("[data-tip]");
    if (!el) { hideTip(); return; }
    if (el !== tipFor) showTip(el, { x: ev.clientX, y: ev.clientY });
  });
  document.addEventListener("mousemove", function (ev) { if (!touch && tipFor) placeTip({ x: ev.clientX, y: ev.clientY }); });
  document.addEventListener("click", function (ev) {
    var t = ev.target;
    var g = t.closest && t.closest("[data-pub]");
    if (g) { ev.preventDefault(); openGear(g.getAttribute("data-pub"), g.getAttribute("data-ck"), g.getAttribute("data-pc")); return; }
    if (t.closest && t.closest("[data-close]")) { closeGear(); return; }
    if (t.closest && t.closest("#xpdN")) { XPD_N = XPD_N === 7 ? 30 : 7; redraw(); return; }
    var el = t.closest && t.closest("[data-tip]");
    if (el && touch) {
      // (a phone: tap an item for its tooltip, tap again or elsewhere to close)
      if (el === tipFor) { hideTip(); return; }
      hideTip();
      el.classList.add("tap");
      var rc = el.getBoundingClientRect();
      showTip(el, { x: Math.max(8, rc.left - 14), y: rc.bottom - 6 });
      return;
    }
    if (!el) hideTip();
    if (t === $("ov")) closeGear();
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") { if (tipFor) hideTip(); else if (GEAR.ck) closeGear(); } });
  window.addEventListener("scroll", function () { if (touch) hideTip(); }, { passive: true });
  loadGfx();

  $("reload").addEventListener("click", load);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && (!last || Date.now() - last.at > REFRESH)) load(); });
  setInterval(function () { if (!document.hidden) load(); }, REFRESH);
  load();
})();
</script>
</body>
</html>
